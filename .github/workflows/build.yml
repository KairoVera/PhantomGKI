name: Kernel Build Process
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      variant:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: ""
      susfs_commit:
        required: false
        type: string
        default: ""
      root_flavor:
        required: false
        type: string
        default: ""
      root_commit:
        required: false
        type: string
        default: ""
      nomount_commit:
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        required: false
        type: string
        default: ""
      anykernel3_commit:
        required: false
        type: string
        default: ""
      droidspaces_commit:
        required: false
        type: string
        default: ""
      brand_name:
        required: false
        type: string
        default: Wild
      bypass:
        required: false
        type: boolean
        default: false
      use_cache:
        description: "Enable ccache/bazel cache (restore/save via release buckets)"
        required: false
        type: boolean
        default: true
    secrets:
      RTL8812AU_GIT_TOKEN:
        description: "repo-scope token to clone the private RTL8812AU driver repo"
        required: false

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ inputs.variant }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Emergency Disk Cleanup
      if: false
      uses: ./.github/actions/disk-cleanup

    - name: Free Disk Space
      if: true
      uses: endersonmenezes/free-disk-space@v4  # Use @main for latest, @v3 for stable
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"  # Use 'rmz' for faster deletion (default: 'rm')
        rmz_version: "3.2.0"  # Required when rm_cmd is 'rmz'
        testing: false

    - name: Setup more Swap (for LTO)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Setup Build Environment
      uses: ./.github/actions/setup-build-environment
      with:
        version: ${{ inputs.version }}
        sublevel: ${{ inputs.sublevel }}
        kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
        anykernel3_commit: ${{ inputs.anykernel3_commit }}
          
    - name: Download Kernel Repository
      uses: ./.github/actions/download-kernel
      with:
        version: ${{ inputs.version }}
        android_version: ${{ inputs.android_version }}
        kernel_version: ${{ inputs.kernel_version }}
        os_patch_level: ${{ inputs.os_patch_level }}

    - name: Set Build Timestamp from Kernel Commit
      shell: bash
      run: |
        set -x
        # Hardcode the build timestamp to the 5th day of the patch level
        # at 04:20 UTC, using the existing timestamp formats expected by the build.
        OS_PATCH_LEVEL_INPUT="${{ inputs.os_patch_level }}"
        if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
          if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
            OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
          else
            OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
          fi
        else
          OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
        fi
        FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
        SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
        echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
        KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
        echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
        # Keep git metadata aligned with the same fixed timestamp.
        GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
        echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
        echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
        echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

    - name: Extract Sublevel and Set File Name
      id: extract
      uses: ./.github/actions/extract-sublevel-file-name
      with:
        android_version: ${{ inputs.android_version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ inputs.sublevel }}
        os_patch_level: ${{ inputs.os_patch_level }}
        variant: ${{ inputs.variant }}

    - name: Kernel Fixes
      uses: ./.github/actions/kernel-fixes
      with:
        version: ${{ inputs.version }}
        android_version: ${{ inputs.android_version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}
        os_patch_level: ${{ inputs.os_patch_level }}

    - name: Setup Selected Root Implementation
      if: inputs.root_flavor != ''
      uses: ./.github/actions/root-setup
      with:
        flavor: ${{ inputs.root_flavor }}
        commit: ${{ inputs.root_commit }}

    - name: ReSukiSU SUSFS Interface Compat Patch
      if: inputs.root_flavor == 'resukisu'
      shell: bash
      run: |
        set -euo pipefail
        SUPERCALL="${{ github.workspace }}/ReSukiSU/kernel/supercall/supercall.c"
        if [ ! -f "$SUPERCALL" ]; then
          echo "supercall.c not found, skipping compat patch"
          exit 0
        fi
        if grep -q 'ksu_install_su_fd' "$SUPERCALL"; then
          echo "compat alias already present"
          exit 0
        fi
        printf '\n/* Compat alias: SUSFS gki patch calls ksu_install_su_fd */\nint ksu_install_su_fd(void)\n{\n\treturn ksu_install_fd();\n}\n' >> "$SUPERCALL"
        echo "ReSukiSU SUSFS interface compat patch applied"

    - name: Disable SUSFS for ReSukiSU without SUSFS feature
      if: inputs.root_flavor == 'resukisu' && !contains(inputs.feature_set, 'SUSFS')
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU_SUSFS=n

    - name: Resolve SUSFS commit
      id: susfs-cm
      shell: bash
      run: |
        set -euo pipefail
        # KernelSU-Next (next) always uses the latest susfs4ksu gki branch tip so
        # SUSFS stays API-matched to the always-latest KernelSU-Next tree. All
        # other roots (kernelsu, resukisu) use the pinned verified SUSFS commit.
        if [ "${{ inputs.root_flavor }}" = "next" ]; then
          BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          SUSFS_COMMIT="$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git "refs/heads/${BRANCH}" | cut -f1)"
          echo "KernelSU-Next: resolving SUSFS at latest on ${BRANCH} -> ${SUSFS_COMMIT}"
        else
          SUSFS_COMMIT="${{ inputs.susfs_commit }}"
          echo "Using pinned SUSFS commit: ${SUSFS_COMMIT}"
        fi
        echo "commit=${SUSFS_COMMIT}" >> "$GITHUB_OUTPUT"

    - name: SUSFS
      if: contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All'
      uses: ./.github/actions/susfs
      with:
        susfs_commit: ${{ steps.susfs-cm.outputs.commit }}
        version: ${{ inputs.version }}
        android_version: ${{ inputs.android_version }}
        kernel_version: ${{ inputs.kernel_version }}
        os_patch_level: ${{ inputs.os_patch_level }}
        sublevel: ${{ steps.extract.outputs.sublevel }}
        root_flavor: ${{ inputs.root_flavor }}

    - name: Fix statfs.c implicit declaration of susfs_sus_kstat_spoof_vfs_statfs
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        if [ -f fs/statfs.c ] && grep -q "susfs_sus_kstat_spoof_vfs_statfs" fs/statfs.c; then
          if awk '/susfs_statfs_by_dentry/{exit 1} /extern int susfs_sus_kstat_spoof_vfs_statfs/{exit 0}' fs/statfs.c; then
            echo "[*] fs/statfs.c already has forward declaration before use"
          else
            echo "[*] Patching fs/statfs.c: adding forward declaration before susfs_statfs_by_dentry"
            sed -i 's/^static int susfs_statfs_by_dentry(struct dentry \*dentry, struct kstatfs \*buf, bool \*is_fuse)$/extern int susfs_sus_kstat_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf, bool *is_fuse);\nstatic int susfs_statfs_by_dentry(struct dentry *dentry, struct kstatfs *buf, bool *is_fuse)/' fs/statfs.c
            grep -n "susfs_sus_kstat_spoof_vfs_statfs" fs/statfs.c | head -5
          fi
        else
          echo "[*] fs/statfs.c not SUSFS-patched, skipping"
        fi
    - name: Fix susfs.c missing security.h include
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        if [ -f fs/susfs.c ] && grep -q "security_sb_statfs" fs/susfs.c; then
          if grep -q '#include <linux/security.h>' fs/susfs.c; then
            echo "[*] fs/susfs.c already includes linux/security.h"
          else
            echo "[*] Patching fs/susfs.c: adding #include <linux/security.h>"
            sed -i '0,/^#include/s//#include <linux\/security.h>\n#include/' fs/susfs.c
            grep -n 'security.h' fs/susfs.c | head -3
          fi
        else
          echo "[*] fs/susfs.c not present or no security_sb_statfs call, skipping"
        fi
    - name: Fix selinux_hide pointer-bool-conversion on 6.6+ (ALL branches)
      shell: bash
      run: |
        set -euo pipefail
        KVER="${{ inputs.kernel_version }}"
        if [ "$(printf '%s\n' "6.6" "$KVER" | sort -V | head -n1)" = "6.6" ]; then
          echo "[*] KVER $KVER >= 6.6, patching selinux_hide.c (all flavors/branches)"
          for f in $(find "${{ github.workspace }}" -name selinux_hide.c 2>/dev/null); do
            # After SUSFS 10_enable (kernelsu only) the declaration becomes
            #   extern void security_dump_masked_av_fn(...)   (a function)
            #   if (func) / if (func != NULL) both trigger -Werror:
            #     -Wpointer-bool-conversion  vs  -Wtautological-pointer-compare
            # For the function form,  &func != NULL  silences both (clang note).
            # For the pointer form (resukisu/next, no 10_enable) we want ptr != NULL.
            if grep -q "extern void security_dump_masked_av_fn" "$f"; then
              echo "[*] $f is extern-function form (10_enable applied), patching with &"
              sed -i 's/if (security_dump_masked_av_fn)/if (\&security_dump_masked_av_fn)/g' "$f"
              sed -i 's/if (security_dump_masked_av_fn != NULL)/if (\&security_dump_masked_av_fn != NULL)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn)/if (\&context_struct_compute_av_fn)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn != NULL)/if (\&context_struct_compute_av_fn != NULL)/g' "$f"
              echo "[+] Patched $f (function form)"
            elif grep -q "if (security_dump_masked_av_fn" "$f"; then
              echo "[*] $f is pointer form, patching with != NULL"
              sed -i 's/if (security_dump_masked_av_fn)/if (security_dump_masked_av_fn != NULL)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn)/if (context_struct_compute_av_fn != NULL)/g' "$f"
              echo "[+] Patched $f (pointer form)"
            else
              echo "[*] $f already patched"
            fi
            # Next (and tiann without 10_enable fallback) declares the 3 helpers as
            # static on 6.6, but kernel hooks.c/selinuxfs.c reference them as extern
            # after SUSFS (ReSukiSU uses __maybe_static -> global). Strip static so
            # the linker can resolve security_context_to_sid_with_policy etc.
            if grep -q "^static int security_context_to_sid_with_policy" "$f"; then
              echo "[*] Stripping static from $f helpers (Next 6.6)"
              sed -i 's/^static int security_context_to_sid_with_policy/int security_context_to_sid_with_policy/g' "$f"
              sed -i 's/^static int security_sid_to_context_with_policy/int security_sid_to_context_with_policy/g' "$f"
              sed -i 's/^static void security_compute_av_user_with_policy/void security_compute_av_user_with_policy/g' "$f"
              # also forward decls (same prefix, same sed covers them)
              echo "[+] Stripped static from $f"
            fi
          done
        else
          echo "[-] KVER $KVER < 6.6"
        fi

    - name: Baseband Guard
      if: (contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'All')
      uses: ./.github/actions/bbg

    - name: Setup Networking
      if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
      uses: ./.github/actions/networking
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        android_version: ${{ inputs.android_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: DroidSpaces-OSS Patches
      if: contains(inputs.feature_set, 'DS') || inputs.feature_set == 'All'
      uses: ./.github/actions/droidspaces
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        droidspaces_commit: ${{ inputs.droidspaces_commit }}

    - name: Apply NTSync Patches
      if: contains(inputs.feature_set, 'NTSync')
      uses: ./.github/actions/ntsync
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Apply Ptrace Patch
      if: contains(inputs.feature_set, 'Ptrace')
      uses: ./.github/actions/ptrace
      with:
        kernel_version: ${{ inputs.kernel_version }}

    - name: Apply Unicode Fix Patch
      if: contains(inputs.feature_set, 'Unicode')
      uses: ./.github/actions/unicode-fix
      with:
        kernel_version: ${{ inputs.kernel_version }}

    - name: Apply Performance Patches
      uses: ./.github/actions/performance
      if: contains(inputs.feature_set, 'Perf')
      with:
        kernel_version: ${{ inputs.kernel_version }}

    - name: Setup Misc Configs
      uses: ./.github/actions/misc

    - name: Enable BPF Stack (BTF + eBPF + FUSE-BPF)
      if: contains(inputs.feature_set, 'BPF')
      uses: ./.github/actions/btf
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Apply Device-Specific Patches
      uses: ./.github/actions/apply-device-patches
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}

    - name: Integrate NoMount
      if: contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All'
      uses: ./.github/actions/nomount
      with:
        commit: ${{ inputs.nomount_commit }}
        kernel_version: ${{ inputs.kernel_version }}

    - name: Apply ABI Compare Bypass
      if: false
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # ABI compare bypass per kernel/android version
        # Edit each block as needed per version
        if [[ "$ANDROID_VERSION" == "android12" && "$KERNEL_VERSION" == "5.10" ]]; then
          sed -i 's/^\s*exit 1$/    echo "Who Cares? Bypassing Now!"/' build/abi/compare_to_symbol_list
        elif [[ "$ANDROID_VERSION" == "android13" && "$KERNEL_VERSION" == "5.10" ]]; then
          sed -i 's/^\s*exit 1$/    echo "Who Cares? Bypassing Now!"/' build/kernel/abi/compare_to_symbol_list
        elif [[ "$ANDROID_VERSION" == "android13" && "$KERNEL_VERSION" == "5.15" ]]; then
          sed -i 's/^\s*exit 1$/    echo "Who Cares? Bypassing Now!"/' build/kernel/abi/compare_to_symbol_list
        elif [[ "$ANDROID_VERSION" == "android14" && "$KERNEL_VERSION" == "5.15" ]]; then
          perl -i -pe 's/^(\s*)return 1$/$1print("Who Cares? Bypassing Now!")\n$1return 0/g if /if missing_symbols:/../return 1/' build/kernel/abi/check_buildtime_symbol_protection.py
        elif [[ "$ANDROID_VERSION" == "android14" && "$KERNEL_VERSION" == "6.1" ]]; then
          perl -i -pe 's/^(\s*)return 1$/$1print("Who Cares? Bypassing Now!")\n$1return 0/g if /if missing_symbols:/../return 1/' build/kernel/abi/check_buildtime_symbol_protection.py
        elif [[ "$ANDROID_VERSION" == "android15" && "$KERNEL_VERSION" == "6.6" ]]; then
          perl -i -pe 's/^(\s*)return 1$/$1print("Who Cares? Bypassing Now!")\n$1return 0/g if /if missing_symbols:/../return 1/' build/kernel/abi/check_buildtime_symbol_protection.py
        fi

    - name: Apply Kernel Branding
      uses: ./.github/actions/apply-kernel-branding
      with:
        variant: ${{ inputs.variant }}
        kernel_version: ${{ inputs.kernel_version }}
        android_version: ${{ inputs.android_version }}
        version: ${{ inputs.version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}
        brand_name: ${{ inputs.brand_name }}

    - name: Remove Protected Exports
      uses: ./.github/actions/remove-protected-exports

    - name: Clean Kernel Flags
      uses: ./.github/actions/clean-kernel-flags

    - name: Scan and collect patch rejects
      id: scan
      if: always()
      uses: ./.github/actions/scan-patch-rejects
        
    - name: Upload Rejects
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-Rejects
        path: patch-rejects/
        if-no-files-found: ignore
        compression-level: 9

    - name: 'Setup Cache and Build Environment'
      if: inputs.use_cache
      uses: ./.github/actions/cache-setup
      with:
        version: ${{ inputs.version }}
        android_version: ${{ inputs.android_version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Restore ccache
      id: restore-ccache
      continue-on-error: true
      if: inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
      uses: ./.github/actions/cache-restore
      with:
        cache_path: /home/runner/.ccache
        cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
        cache_bucket: ccache-cache-${{ inputs.version }}-${{ inputs.variant }}
        restore_keys: |
          ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-

    - name: Restore bazel-cache
      id: restore-bazel
      continue-on-error: true
      if: inputs.use_cache && (inputs.version == 'android14-5.15' || inputs.version == 'android14-6.1' || inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12')
      uses: ./.github/actions/cache-restore
      with:
        cache_path: /home/runner/.cache/bazel
        cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
        cache_bucket: bazel-cache-${{ inputs.version }}-${{ inputs.variant }}
        restore_keys: |
          ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-

    - name: Cache ccache (GitHub Native)
      if: false
      uses: actions/cache@v6
      with:
        path: /home/runner/.ccache
        key: ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}
        restore-keys: |
          ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-
          ccache-${{ inputs.android_version }}-${{ inputs.kernel_version }}-
          ccache-

    - name: Cache bazel-cache (GitHub Native)
      if: false
      uses: actions/cache@v6
      with:
        path: /home/runner/.cache/bazel
        key: bazel-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}
        restore-keys: |
          bazel-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-
          bazel-${{ inputs.android_version }}-${{ inputs.kernel_version }}-
          bazel-

    - name: Check cache hit
      run: |
        echo "Cache restore status:"
        CCACHE_HIT="${{ steps.restore-ccache.outputs.cache-hit || 'skipped' }}"
        BAZEL_HIT="${{ steps.restore-bazel.outputs.cache-hit || 'skipped' }}"
        echo "  ccache: $CCACHE_HIT"
        echo "  bazel: $BAZEL_HIT"

    - name: Get Cache Stats
      uses: ./.github/actions/cache-stats
      with:
        clear_stats: true

    - name: Initialize Config Fragment
      run: touch "${{ github.workspace }}/wild_gki.fragment"

    - name: Apply Kernel Bypass Hack
      if: ${{ inputs.bypass == 'true' }}
      uses: ./.github/actions/bypass-kernel
      with:
        version: ${{ inputs.version }}
        bypass: true

    - name: Build Normal Kernel
      env:
        SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
      uses: ./.github/actions/build-kernel
      with:
        version: ${{ inputs.version }}

    - name: Build RTL8812AU External Module
      shell: bash
      env:
        RTL8812AU_REPO: KairoVera/rtl8812au-phantom
        RTL8812AU_GIT_TOKEN: ${{ secrets.RTL8812AU_GIT_TOKEN }}
      run: |
        set -euo pipefail
        WS="${{ github.workspace }}"
        KSRC="$WS/kernel/common"
        # 驱动源来自同账号私有仓库 rtl8812au-phantom（含全部修复）。
        # 必须由 main→prepare 显式映射进来的 secrets.RTL8812AU_GIT_TOKEN（repo 权限）克隆：
        # 受限的 GITHUB_TOKEN 只有 PhantomGKI 的 contents:write，读不了兄弟私有仓，
        # 用它会 401 "Invalid username or token"。
        if [ -n "${RTL8812AU_GIT_TOKEN:-}" ]; then
          echo "Using dedicated RTL8812AU git token (len=${#RTL8812AU_GIT_TOKEN})"
          TOKEN="$RTL8812AU_GIT_TOKEN"
        else
          echo "::warning::RTL8812AU_GIT_TOKEN secret is EMPTY - falling back to GITHUB_TOKEN, which cannot read the private driver repo"
          TOKEN="$GITHUB_TOKEN"
        fi
        CLONE_URL="https://x-access-token:${TOKEN}@github.com/${RTL8812AU_REPO}.git"
        # ---- 诊断：分清 DNS / 代理 / token 权限 三类失败 ----
        echo "=== RTL8812AU clone diagnostics ==="
        if getent hosts github.com >/dev/null 2>&1; then echo "github.com DNS: OK"; else echo "github.com DNS: FAIL"; fi
        env | grep -iE '^http_proxy|^https_proxy|^no_proxy|^HTTP_' || echo "(no proxy env vars)"
        git ls-remote https://github.com/Octocat/Hello-World.git HEAD >/dev/null 2>&1 && echo "public github reachable: YES" || echo "public github reachable: NO"
        git ls-remote "$CLONE_URL" HEAD >/dev/null 2>&1 && echo "private repo reachable w/ token: YES" || echo "private repo reachable w/ token: NO"
        # 网络/DNS 偶发，4 次重试、间隔拉长到 30s（同 runner 上 DNS 抖动）
        ok=1
        for attempt in 1 2 3 4; do
          if git clone --depth 1 "$CLONE_URL" "$WS/rtl8812au-phantom"; then
            ok=0; break
          fi
          echo "RTL8812AU clone attempt $attempt failed; retrying in 30s..."
          rm -rf "$WS/rtl8812au-phantom"; sleep 30
        done
        if [ "$ok" -ne 0 ]; then
          echo "::error::failed to clone ${RTL8812AU_REPO} after 4 attempts — see diagnostics above (DNS/proxy/token); rerun the job on a fresh runner"
          exit 1
        fi
        echo "Cloned ${RTL8812AU_REPO} ($(git -C "$WS/rtl8812au-phantom" rev-parse --short HEAD))"
        DRIVER="$WS/rtl8812au-phantom"
        if [ ! -f "$KSRC/Makefile" ]; then echo "kernel source tree missing, skipping driver build"; exit 0; fi
        if [ ! -f "$DRIVER/Makefile" ]; then echo "driver source missing, skipping driver build"; exit 0; fi
        CLANG_BIN="$(command -v clang || command -v clang-12 || true)"
        if [ -z "$CLANG_BIN" ]; then
          CLANG_BIN="$(find "$WS/kernel/prebuilts-master/clang/host/linux-x86" -path '*/bin/clang' -type f 2>/dev/null | sort | tail -1 || true)"
        fi
        if [ -z "$CLANG_BIN" ]; then echo "no clang found in PATH or prebuilts-master" >&2; exit 1; fi
        echo "Using clang: $CLANG_BIN"
        CLANG_DIR="$(dirname "$CLANG_BIN")"
        export PATH="$CLANG_DIR:$PATH"
        LLD_BIN="$(find "$CLANG_DIR" "$WS/kernel/prebuilts-master" "$WS/kernel/build/build-tools" -name 'ld.lld' -type f 2>/dev/null | head -1 || true)"
        if [ -z "$LLD_BIN" ]; then
          LLD_BIN="$(find "$CLANG_DIR" -name 'lld' -type f 2>/dev/null | head -1 || true)"
        fi
        if [ -z "$LLD_BIN" ]; then echo "ld.lld/lld not found in toolchain or build-tools" >&2; exit 1; fi
        echo "Using linker: $LLD_BIN"
        sudo -n ln -sf "$LLD_BIN" /usr/local/bin/ld 2>/dev/null || true
        MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-"
        KOUT=""
        for d in /home/runner/out/common "$WS/out/common"; do
          if [ -f "$d/.config" ]; then KOUT="$d"; break; fi
        done
        if [ -n "$KOUT" ]; then
          echo "Using prepared kernel output dir: $KOUT"
          MAKE_ARGS="$MAKE_ARGS O=$KOUT"
        elif [ ! -f "$KSRC/.config" ]; then
          make -C "$KSRC" $MAKE_ARGS gki_defconfig
          make -C "$KSRC" $MAKE_ARGS -j"$(nproc)" modules_prepare
        fi
        # 外部模块 M= 构建不会自动读内核 symvers (v4 实测 35 全 undefined)，
        # 必须显式喂 KBUILD_EXTRA_SYMBOLS。喂 聚合 Module.symvers 会
        # "exported twice" (v3 实测 media_entity_pads_init: 聚合含 vmlinux 段,
        # 该内置符号被读两遍)。vmlinux.symvers 是纯 vmlinux 内置段、每符号
        # 一行, cfg80211=y 后 31 个无线符号 + 4 核心符号全在其中, 喂它不撞车。
        # 外部模块 M= 构建不会自动读内核 symvers (v4 实测 35 全 undefined)，
        # 必须显式喂 KBUILD_EXTRA_SYMBOLS。但喂"整张"表(聚合 Module.symvers 或
        # 整份 vmlinux.symvers)会让 modpost 把 vmlinux 内置段里的
        # media_entity_pads_init 记两遍 -> FATAL "exported twice" (v3/v5 实测)。
        # 治本: 只喂驱动真正用到的 35 个符号 (4 核心 + 31 无线, cfg80211=y 时
        # 全内置)。media_entity_pads_init 不在其中, 不进 modpost 视野 -> 不
        # dup; 35 个都在且各一行 -> 不 undefined。
        SYMS_FULL="${KOUT:-$KSRC}/Module.symvers"
        if [ ! -f "$SYMS_FULL" ]; then echo "::error::kernel Module.symvers not found at $SYMS_FULL — 'Build Normal Kernel' must run first"; exit 1; fi
        SYMS_FILTER="${KOUT:-$KSRC}/Module.symvers.rtl8812"
        RTL_RE='^(kernel_read|kernel_write|yield|proc_get_parent_data|wiphy_new_nm|wiphy_register|wiphy_unregister|wiphy_free|wiphy_apply_custom_regulatory|cfg80211_mgmt_tx_status|cfg80211_ready_on_channel|cfg80211_rx_mgmt_khz|cfg80211_del_sta_sinfo|cfg80211_connect_done|cfg80211_inform_bss_frame_data|cfg80211_new_sta|cfg80211_sinfo_alloc_tid_stats|cfg80211_cqm_rssi_notify|cfg80211_unlink_bss|cfg80211_scan_done|cfg80211_disconnected|cfg80211_roamed|cfg80211_ibss_joined|cfg80211_get_bss|cfg80211_put_bss|cfg80211_ch_switch_notify|cfg80211_ch_switch_started_notify|cfg80211_michael_mic_failure|cfg80211_remain_on_channel_expired|ieee80211_channel_to_freq_khz|ieee80211_freq_khz_to_channel|ieee80211_get_channel_khz|ieee80211_radiotap_iterator_init|ieee80211_radiotap_iterator_next)$'
        # symvers 列布局随 MODVERSIONS 变: =y 时 "0xcrc<TAB>sym<TAB>mod<TAB>type"
        # (sym=$2), =n 时 "sym<TAB>mod<TAB>type" (sym=$1)。不再假设列号, 逐字段
        # 整词匹配; 按符号名去重, 防同符号跨段出现 -> "exported twice"。
        awk -F'\t' -v re="$RTL_RE" '{ for(i=1;i<=NF;i++) if($i ~ re && !seen[$i]++){ print; break } }' "$SYMS_FULL" > "$SYMS_FILTER"
        echo "Feeding modpost: $SYMS_FILTER ($(wc -l < "$SYMS_FILTER") of 35 symbols; media_entity_pads_init excluded)"
        # 诊断: 万一再翻车, 直接看 GKI 真实 symvers 列格式 (cat -A 显示 tab)
        echo "=== SYMS_FULL head (cat -A) ==="; head -3 "$SYMS_FULL" | cat -A
        echo "=== SYMS_FILTER full content (cat -A) ==="; cat -A "$SYMS_FILTER"
        # 核对 35 个是否都在 (列号无关, 整词匹配), 缺了 modpost 会 undefined
        for s in kernel_read kernel_write yield proc_get_parent_data wiphy_new_nm wiphy_register wiphy_unregister wiphy_free wiphy_apply_custom_regulatory cfg80211_mgmt_tx_status cfg80211_ready_on_channel cfg80211_rx_mgmt_khz cfg80211_del_sta_sinfo cfg80211_connect_done cfg80211_inform_bss_frame_data cfg80211_new_sta cfg80211_sinfo_alloc_tid_stats cfg80211_cqm_rssi_notify cfg80211_unlink_bss cfg80211_scan_done cfg80211_disconnected cfg80211_roamed cfg80211_ibss_joined cfg80211_get_bss cfg80211_put_bss cfg80211_ch_switch_notify cfg80211_ch_switch_started_notify cfg80211_michael_mic_failure cfg80211_remain_on_channel_expired ieee80211_channel_to_freq_khz ieee80211_freq_khz_to_channel ieee80211_get_channel_khz ieee80211_radiotap_iterator_init ieee80211_radiotap_iterator_next; do
          awk -F'\t' -v s="$s" '{ for(i=1;i<=NF;i++) if($i==s){f=1} } END{ if(!f) exit 1 }' "$SYMS_FILTER" || echo "::error:: symbol $s missing from filtered symvers"
        done
        make -C "$KSRC" $MAKE_ARGS -j"$(nproc)" \
          CONFIG_PLATFORM_ANDROID_ARM64=y \
          CONFIG_88XXAU=m \
          M="$DRIVER" \
          KBUILD_EXTRA_SYMBOLS="$SYMS_FILTER" modules
        mkdir -p "$WS/AnyKernel3/modules"
        cp -v "$DRIVER"/*.ko "$WS/AnyKernel3/modules/"
        echo "RTL8812AU module built and packaged into AnyKernel3/modules"

    - name: Get Cache Stats
      uses: ./.github/actions/cache-stats
      with:
        clear_stats: false

    - name: Prune ccache before save
      if: always() && inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
      shell: bash
      run: |
        if [ -d /home/runner/.ccache ]; then
          ccache -c 2>/dev/null || true
          find /home/runner/.ccache -type f -mtime +0.5 -delete 2>/dev/null || true
          find /home/runner/.ccache -type d -empty -delete 2>/dev/null || true
          echo "ccache pruned"; ccache -s 2>/dev/null | head -20 || true
        fi

    - name: Save ccache
      continue-on-error: true
      uses: ./.github/actions/cache-save
      if: always() && inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
      with:
        cache_path: /home/runner/.ccache
        cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
        cache_bucket: "ccache-cache-${{ inputs.version }}-${{ inputs.variant }}"
        compression_level: 9
        github_token: ${{ github.token }}

    - name: Save bazel-cache
      continue-on-error: true
      uses: ./.github/actions/cache-save
      if: always() && inputs.use_cache && (inputs.version == 'android14-5.15' || inputs.version == 'android14-6.1' || inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12')
      with:
        cache_path: /home/runner/.cache/bazel
        cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
        cache_bucket: "bazel-cache-${{ inputs.version }}-${{ inputs.variant }}"
        compression_level: 9
        github_token: ${{ github.token }}

    - name: Build Bypass Kernel
      if: inputs.build_bypass
      env:
        SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
      uses: ./.github/actions/build-kernel
      with:
        version: ${{ inputs.version }}

    - name: Consolidated Build Summary
      if: always()
      shell: bash
      run: |
        SUMMARY_BASE="${{ steps.extract.outputs.file_name }}"
        if [ -z "${SUMMARY_BASE}" ]; then
          SUMMARY_BASE="${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}"
          VARIANT="${{ inputs.variant }}"
          if [ -n "${VARIANT}" ] && [ "${VARIANT}" != "Normal" ]; then
            SUMMARY_BASE="${SUMMARY_BASE}-${VARIANT}"
          fi
        fi
        SUMMARY_FILE="/tmp/build-summary-${SUMMARY_BASE}.md"
        echo "SUMMARY_BASE=${SUMMARY_BASE}" >> "$GITHUB_ENV"

        # NoMount is optional (nomount_commit input is always populated, so
        # feature_set is the only reliable signal for whether it was built).
        NOMOUNT_ENABLED="false"
        if [ "${{ contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All' }}" = "true" ]; then
          NOMOUNT_ENABLED="true"
        fi
        
        # Determine build status
        if [ "${{ job.status }}" = "success" ]; then
          STATUS="[+] Success"
        else
          STATUS="[-] Failed"
        fi
        
        # Get kernel version from Image if available
        KERNEL_VER_STR=""
        if [ -f "/home/runner/out/dist/Image" ]; then
          KERNEL_VER_STR=$(strings "/home/runner/out/dist/Image" | grep -m1 "^Linux version " | sed 's/Linux version //' || echo "")
        elif [ -f "/home/runner/out/Image" ]; then
          KERNEL_VER_STR=$(strings "/home/runner/out/Image" | grep -m1 "^Linux version " | sed 's/Linux version //' || echo "")
        fi
        
        # Get KSU version from env (set by kernelsu action)
        KSU_VER="${KSU_VERSION:-N/A}"
        KSU_TAG="${KSU_GIT_TAG:-N/A}"
        ROOT_IMPL="${ROOT_IMPLEMENTATION:-KernelSU-Next (legacy path)}"
        ROOT_MANAGER="${ROOT_MANAGER:-KernelSU-Next Manager}"
        ROOT_VERSION="${ROOT_VERSION:-${KSU_TAG}}"
        ROOT_SHA="${ROOT_COMMIT:-${KSU_COMMIT:-N/A}}"
        if [ "$NOMOUNT_ENABLED" = "true" ]; then
          NOMOUNT_SHA="${NOMOUNT_COMMIT:-${{ inputs.nomount_commit }}}"
        else
          NOMOUNT_SHA="N/A"
        fi
        SUSFS_SHA="${SUSFS_COMMIT:-${{ inputs.susfs_commit }}}"
        
        # Get SUSFS version from susfs.h if available
        SUSFS_VER="N/A"
        if [ -f "${{ github.workspace }}/kernel/common/include/linux/susfs.h" ]; then
          SUSFS_VER=$(grep '#define SUSFS_VERSION' "${{ github.workspace }}/kernel/common/include/linux/susfs.h" | awk -F'"' '{print $2}' || echo "N/A")
        fi
        
        # Get cache stats from env (set by cache-stats action)
        CCACHE_HIT="${CCACHE_HIT_RATE:-N/A}"
        
        # Get build time (approximate from step timing)
        BUILD_TIME="N/A"
        
        # Count warnings from build log if available
        WARNINGS="N/A"
        
        {
          echo "## ${{ inputs.android_version }} ${{ inputs.kernel_version }}.${{ inputs.sublevel }} (${{ inputs.variant }}) - ${STATUS}"
          echo
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| **Status** | ${STATUS} |"
          echo "| **Kernel** | ${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} |"
          if [ -n "$KERNEL_VER_STR" ]; then
            echo "| **Version String** | \`${KERNEL_VER_STR}\` |"
          fi
          echo "| **KSU Version** | ${KSU_VER} |"
          echo "| **KSU Tag** | ${KSU_TAG} |"
          echo "| **Root Implementation** | ${ROOT_IMPL} |"
          echo "| **Root Manager** | ${ROOT_MANAGER} |"
          echo "| **Root Version** | ${ROOT_VERSION} |"
          echo "| **Root Commit** | ${ROOT_SHA} |"
          echo "| **SUSFS Version** | ${SUSFS_VER} |"
          echo "| **SUSFS Commit** | ${SUSFS_SHA} |"
          echo "| **NoMount Commit** | ${NOMOUNT_SHA} |"
          echo "| **Feature Set** | ${{ inputs.feature_set }} |"
          echo "| **Variant** | ${{ inputs.variant }} |"
          echo
          
          # Kernel Fixes
          if [ -f /tmp/kernel-fixes-summary.md ]; then
            echo "### Kernel Fixes"
            cat /tmp/kernel-fixes-summary.md
            echo
          fi
        } > "$SUMMARY_FILE"

    - name: Upload Artifacts
      id: kernel-artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-AnyKernel3
        path: ${{ github.workspace }}/AnyKernel3/**
        if-no-files-found: ignore
        compression-level: 9

    - name: Write Build-verified only artifact metadata
      if: success() && inputs.root_flavor != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # NoMount is optional: only resolve its artifact when requested.
        # (nomount_commit input is always populated, so feature_set is the
        # only reliable signal for whether NoMount was integrated.)
        NOMOUNT_ENABLED="false"
        if [ "${{ contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All' }}" = "true" ]; then
          NOMOUNT_ENABLED="true"
        fi

        if [ "$NOMOUNT_ENABLED" = "true" ]; then
          METHOD="GKI source build with SHA-pinned root implementation, SUSFS, and NoMount"
          NOMOUNT_MODULE_COMMIT="${{ inputs.nomount_commit }}"
        else
          METHOD="GKI source build with SHA-pinned root implementation and SUSFS"
          NOMOUNT_MODULE_COMMIT="N/A"
        fi

        metadata_file="/tmp/${SUMMARY_BASE}-metadata.json"
        summary_file="/tmp/build-summary-${SUMMARY_BASE}.md"
        artifacts_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"

        resolve_artifact() {
          local artifact_name="$1"
          local page=1
          local match=""
          local page_file
          page_file="$(mktemp)"

          # Page through the artifacts API, checking each page for the exact
          # artifact name. Uses a temp file for jq input (not argv) so large
          # artifact lists can't exceed the OS argument-length limit.
          while :; do
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${artifacts_api}&page=${page}" -o "$page_file"

            match="$(jq -r --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | .[0]
               | if . == null then "" else (.archive_download_url + "\t" + .digest) end' \
              "$page_file")"

            items="$(jq '(.artifacts | length) // 0' "$page_file")"
            if [ "$items" -lt 100 ] || [ -n "$match" ]; then
              break
            fi
            page=$((page + 1))
          done

          rm -f "$page_file"
          if [ -z "$match" ]; then
            echo "Expected exactly one available artifact named ${artifact_name}." >&2
            exit 1
          fi
          printf '%s\n' "$match"
        }

        read -r kernel_artifact_url kernel_artifact_sha256 < <(
          resolve_artifact "${{ steps.extract.outputs.file_name }}-AnyKernel3"
        )
        if [ "$NOMOUNT_ENABLED" = "true" ]; then
          read -r nomount_module_url nomount_module_sha256 < <(
            resolve_artifact "NoMount-Metamodule"
          )
        else
          nomount_module_url="N/A"
          nomount_module_sha256="N/A"
        fi

        jq -n \
          --arg method "$METHOD" \
          --arg root_implementation "${ROOT_IMPLEMENTATION:-KernelSU-Next (legacy path)}" \
          --arg root_manager "${ROOT_MANAGER:-KernelSU-Next Manager}" \
          --arg root_version "${ROOT_VERSION:-${KSU_GIT_TAG:-N/A}}" \
          --arg root_commit "${ROOT_COMMIT:-${KSU_COMMIT:-N/A}}" \
          --arg susfs_commit "${SUSFS_COMMIT:-N/A}" \
          --arg nomount_commit "${NOMOUNT_COMMIT:-N/A}" \
          --arg android_branch "${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}" \
          --arg kmi "${{ inputs.android_version }}-${{ inputs.kernel_version }}" \
          --arg kernel_source_commit "${KERNEL_SOURCE_COMMIT:-N/A}" \
          --arg provenance_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --arg artifact_url "$kernel_artifact_url" \
          --arg sha256 "$kernel_artifact_sha256" \
          --arg nomount_module_commit "$NOMOUNT_MODULE_COMMIT" \
          --arg nomount_module_url "$nomount_module_url" \
          --arg nomount_module_sha256 "$nomount_module_sha256" \
          --arg status "Build-verified only" \
          --arg catalog_availability "eligible-with-provenance-and-checksums" \
          --arg device_compatibility "not-validated" \
          --arg flashability "not-guaranteed" \
          --arg boot "not-guaranteed" \
          '{
            method: $method,
            root: {
              implementation: $root_implementation,
              manager: $root_manager,
              version: $root_version,
              commit: $root_commit
            },
            susfs_revision: $susfs_commit,
            nomount_commit: $nomount_commit,
            android_branch: $android_branch,
            kmi: $kmi,
            kernel_source_commit: $kernel_source_commit,
            provenance_url: $provenance_url,
            artifact_url: $artifact_url,
            sha256: $sha256,
            nomount_metamodule: {
              commit: $nomount_module_commit,
              artifact_url: $nomount_module_url,
              sha256: $nomount_module_sha256
            },
            catalog: {
              availability: $catalog_availability,
              device_compatibility: $device_compatibility,
              flashability: $flashability,
              boot: $boot
            },
            status: $status
          }' > "$metadata_file"

        jq -e '
          .status == "Build-verified only" and
          (.root.manager | length > 0) and
          (.root.version | length > 0) and
          (.susfs_revision | test("^[0-9a-f]{40}$")) and
          (.kernel_source_commit | test("^[0-9a-f]{40}$")) and
          (.artifact_url | startswith("https://")) and
          (.sha256 | test("^sha256:[0-9a-f]{64}$")) and
          .catalog.availability == "eligible-with-provenance-and-checksums" and
          .catalog.device_compatibility == "not-validated" and
          .catalog.flashability == "not-guaranteed" and
          .catalog.boot == "not-guaranteed"
        ' "$metadata_file" > /dev/null
        if [ "$NOMOUNT_ENABLED" = "true" ]; then
          jq -e '
            (.nomount_commit | test("^[0-9a-f]{40}$")) and
            (.nomount_metamodule.commit == .nomount_commit) and
            (.nomount_metamodule.artifact_url | startswith("https://")) and
            (.nomount_metamodule.sha256 | test("^sha256:[0-9a-f]{64}$"))
          ' "$metadata_file" > /dev/null
        else
          jq -e '
            (.nomount_commit == "N/A") and
            (.nomount_metamodule.commit == "N/A") and
            (.nomount_metamodule.artifact_url == "N/A") and
            (.nomount_metamodule.sha256 == "N/A")
          ' "$metadata_file" > /dev/null
        fi

        # Merge the verified metadata into the combined summary markdown so both
        # live in a single artifact: human-readable table + machine JSON block.
        {
          echo
          echo "## Verified Metadata"
          echo
          echo '```json'
          cat "$metadata_file"
          echo '```'
          echo
        } >> "$summary_file"

    - name: Upload Build Summary + Metadata
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-BuildInfo
        path: /tmp/build-summary-${{ env.SUMMARY_BASE }}.md
        if-no-files-found: warn
        compression-level: 9
